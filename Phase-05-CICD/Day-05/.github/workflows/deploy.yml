name: Production CI/CD to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Validate application
      - name: Validate application
        working-directory: Phase-05-CICD/Day-05/app
        run: |
          npm install
          node -c server.js

      # Step 4: Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Step 5: Upload project to EC2
      - name: Upload project to EC2
        run: |
          rsync -avz --delete Phase-05-CICD/Day-05/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/github-actions-aws-ec2-production/

      # Step 6: Deploy application
      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            cd /home/ec2-user/github-actions-aws-ec2-production
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          '

      # Step 7: Health check
      - name: Health check
        run: |
          curl --retry 5 --retry-delay 5 http://${{ secrets.EC2_HOST }}:3000